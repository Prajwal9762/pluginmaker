name: Android Build

# NOTE: this workflow has been written but NOT fully run yet. Expect to tweak it.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Finds project.godot even if the project was uploaded inside a subfolder.
      - name: Locate Godot project
        run: |
          # If the project was uploaded as a .zip, unpack it here.
          if [ -z "$(find . -name project.godot -not -path './.godot/*' | head -n1)" ]; then
            for z in ./*.zip; do
              [ -f "$z" ] && echo "Unzipping $z" && unzip -q -o "$z" -d unzipped_project
            done
          fi
          echo "Repository files (top level):"
          ls -la
          PF="$(find . -name project.godot -not -path './.godot/*' | head -n1)"
          if [ -z "$PF" ]; then
            echo "ERROR: project.godot not found. Upload ALL project files to the repo."
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$PF")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg is missing from $PROJECT_DIR. Upload it (it is in the zip)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK; use it directly.
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install pinned Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz tpl

      # Let Godot generate its own editor settings file, then append our paths
      # (same approach as the popular godot-ci images).
      - name: Configure Godot Android settings and debug keystore
        run: |
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          godot --headless --editor --quit --path "$PROJECT_DIR" || true
          SETTINGS="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: Godot did not create $SETTINGS"
            ls -la "$HOME/.config/godot" || true
            exit 1
          fi
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
          tail -n 8 "$SETTINGS"

      - name: Import assets
        run: |
          godot --headless --path "$PROJECT_DIR" --import || true
          godot --headless --path "$PROJECT_DIR" --import || true

      # continue-on-error: the code has never been run, so a failing test must not
      # block the APK. Read this step's log, fix failures, then remove this line.
      - name: Run unit tests
        continue-on-error: true
        run: godot --headless --path "$PROJECT_DIR" -s res://tests/run_tests.gd

      - name: Export debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/ZORVI-ARENA-debug.apk"
          ls -la "$GITHUB_WORKSPACE/build"

      # archive: false uploads the .apk itself (not wrapped in a zip). Needs upload-artifact v7+.
      - uses: actions/upload-artifact@v7
        with:
          path: build/ZORVI-ARENA-debug.apk
          archive: false

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ZORVI-ARENA-debug.apk
