name: Build MineCoinsPlugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract all plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-input
          mkdir -p build-input

          shopt -s nullglob
          zips=(./*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository root."
            exit 1
          fi

          for zip in "${zips[@]}"; do
            name="$(basename "$zip" .zip)"
            echo "Extracting: $zip"
            mkdir -p "build-input/$name"
            unzip -q -o "$zip" -d "build-input/$name"
          done

          echo "Maven projects found:"
          find build-input -type f -name pom.xml -print

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            build-input/**/pom.xml

      - name: Build every Maven plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0

          while IFS= read -r -d '' pom; do
            found=1
            project_dir="$(dirname "$pom")"
            echo "========================================"
            echo "Building: $project_dir"
            echo "========================================"

            (
              cd "$project_dir"
              mvn -B -U -DskipTests clean package
            )
          done < <(find build-input -type f -name pom.xml -print0)

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No pom.xml was found in any extracted ZIP."
            exit 1
          fi

      - name: Verify JAR output
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Built plugin JARs"
          echo "========================================"

          mapfile -t jars < <(
            find build-input -type f -path '*/target/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )

          if [ ${#jars[@]} -eq 0 ]; then
            echo "ERROR: Maven completed but no plugin JAR was found."
            exit 1
          fi

          printf '%s\n' "${jars[@]}"

      - name: Upload all plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: MineCoinsPlugins
          path: build-input/**/target/*.jar
          if-no-files-found: error
