name: Build MineChatVote

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  build:

    name: Build MineChatVote
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # EXTRACT ZIP
      # ==========================================

      - name: Extract plugin ZIP
        shell: bash
        run: |

          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::No plugin ZIP found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf build

          mkdir -p build

          unzip -q -o "$ZIP" -d build

          echo ""
          echo "Extracted files:"
          find build -type f | sort


      # ==========================================
      # FIND POM
      # ==========================================

      - name: Locate Maven project
        shell: bash
        run: |

          set -euo pipefail

          POM=$(find build \
            -type f \
            -name "pom.xml" \
            -not -path "*/target/*" \
            | head -n 1)

          if [ -z "$POM" ]; then
            echo "::error::pom.xml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")

          echo "Found:"
          echo "$POM"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # JAVA 21
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Java
        shell: bash
        run: |

          java -version

          mvn -version


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build MineChatVote
        shell: bash
        run: |

          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building MineChatVote"
          echo "=========================================="

          mvn -B -ntp -U \
            clean package \
            -DskipTests


      # ==========================================
      # FIND JAR
      # ==========================================

      - name: Collect JAR
        shell: bash
        run: |

          set -euo pipefail

          JAR=$(find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "original-*.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "::error::No plugin JAR found."
            exit 1
          fi

          echo "Built:"
          echo "$JAR"

          mkdir -p release

          cp "$JAR" release/MineChatVote.jar

          echo ""
          echo "Final plugin:"
          ls -lh release/MineChatVote.jar


      # ==========================================
      # ARTIFACT
      # ==========================================

      - name: Upload MineChatVote
        uses: actions/upload-artifact@v4
        with:
          name: MineChatVote
          path: release/MineChatVote.jar
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # RELEASE
      # ==========================================

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "MineChatVote v${{ github.run_number }}"
          files: release/MineChatVote.jar
          generate_release_notes: true
