name: Build MineChatVote

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version"
        required: false
        default: "21"

      paper_version:
        description: "Paper API version (leave empty to use pom.xml)"
        required: false
        default: ""

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build MineChatVote
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------
      # CHECKOUT
      # -----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------
      # FIND PROJECT
      # -----------------------------------------
      - name: Locate Maven project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for pom.xml..."

          POM="$(find . -type f -name pom.xml \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"

          echo "POM: $POM"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------
      # JAVA
      # -----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml

      # -----------------------------------------
      # JAVA / MAVEN INFO
      # -----------------------------------------
      - name: Show Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn -version

      # -----------------------------------------
      # SHOW PROJECT
      # -----------------------------------------
      - name: Show project structure
        shell: bash
        run: |
          echo "========================================"
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -not -path '*/target/*' \
            | sort

      # -----------------------------------------
      # BUILD
      # -----------------------------------------
      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building MineChatVote"
          echo "========================================"

          if [ -n "${{ inputs.paper_version }}" ]; then
            mvn -B -ntp clean package \
              -DskipTests \
              -Dpaper.version="${{ inputs.paper_version }}"
          else
            mvn -B -ntp clean package \
              -DskipTests
          fi

      # -----------------------------------------
      # FIND JAR
      # -----------------------------------------
      - name: Collect plugin JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          mapfile -t JARS < <(
            find "$PROJECT_DIR/target" \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              ! -name "original-*.jar" \
              -print
          )

          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "::error::No plugin JAR was produced."
            echo ""
            echo "Contents of target:"
            find "$PROJECT_DIR/target" -maxdepth 1 -type f -print || true
            exit 1
          fi

          if [ "${#JARS[@]}" -gt 1 ]; then
            echo "::error::Multiple plugin JARs found:"
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          JAR="${JARS[0]}"

          echo "Built JAR:"
          echo "$JAR"

          cp "$JAR" "release/MineChatVote.jar"

          echo ""
          echo "Final artifact:"
          ls -lh release/MineChatVote.jar

      # -----------------------------------------
      # UPLOAD ARTIFACT
      # -----------------------------------------
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: MineChatVote
          path: release/MineChatVote.jar
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------
      # GITHUB RELEASE
      # -----------------------------------------
      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MineChatVote v${{ github.run_number }}
          files: release/MineChatVote.jar
          generate_release_notes: true
