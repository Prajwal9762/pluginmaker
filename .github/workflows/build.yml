name: Build MineCoinsPlugins

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      paper_version:
        description: "paper-api version (leave empty to use the pom.xml value)"
        required: false
        default: ""
      java_release:
        description: "Java release level for compiling"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Change these defaults if you want push builds to use a specific version
    env:
      PAPER_VERSION: ${{ github.event.inputs.paper_version }}
      JAVA_RELEASE: ${{ github.event.inputs.java_release || '25' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract all plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-input
          mkdir -p build-input

          shopt -s nullglob
          zips=(./*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository root."
            exit 1
          fi

          for zip in "${zips[@]}"; do
            name="$(basename "$zip" .zip)"
            echo "Extracting: $zip"
            mkdir -p "build-input/$name"
            unzip -q -o "$zip" -d "build-input/$name"
          done

          echo "Maven projects found:"
          find build-input -type f -name pom.xml -not -path '*/target/*' -print

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            build-input/**/pom.xml

      - name: Build every Maven plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0

          EXTRA_ARGS=("-Djava.version=${JAVA_RELEASE}")
          if [ -n "${PAPER_VERSION:-}" ]; then
            EXTRA_ARGS+=("-Dpaper.version=${PAPER_VERSION}")
          fi
          echo "Maven overrides: ${EXTRA_ARGS[*]}"

          while IFS= read -r -d '' pom; do
            found=1
            project_dir="$(dirname "$pom")"
            echo "========================================"
            echo "Building: $project_dir"
            echo "========================================"

            (
              cd "$project_dir"
              mvn -B -ntp -U -DskipTests "${EXTRA_ARGS[@]}" clean package
            )
          done < <(find build-input -type f -name pom.xml -not -path '*/target/*' -print0)

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No pom.xml was found in any extracted ZIP."
            exit 1
          fi

      - name: Verify JAR output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build-input -type f -path '*/target/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name 'original-*.jar' \
              -print
          )

          if [ ${#jars[@]} -eq 0 ]; then
            echo "ERROR: Maven completed but no plugin JAR was found."
            exit 1
          fi

          echo "Built plugin JARs:"
          printf '%s\n' "${jars[@]}"

      - name: Upload all plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: MineCoinsPlugins
          path: |
            build-input/**/target/*.jar
            !build-input/**/target/original-*.jar
          if-no-files-found: error
          retention-days: 30
