name: Build Minecraft Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Prepare workspace
        run: |
          rm -rf build-work build-output
          mkdir -p build-work
          mkdir -p build-output

      - name: Extract all ZIP files
        shell: bash
        run: |
          shopt -s nullglob

          zips=( *.zip )

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP files found."
            exit 1
          fi

          for zip in "${zips[@]}"; do
            echo "======================================"
            echo "Extracting: $zip"
            echo "======================================"

            folder="${zip%.zip}"
            mkdir -p "build-work/$folder"

            unzip -o "$zip" -d "build-work/$folder"
          done

      - name: Find Maven projects
        id: projects
        shell: bash
        run: |
          echo "Maven projects found:"

          find build-work \
            -type f \
            -name "pom.xml" \
            -print

          count=$(find build-work -type f -name "pom.xml" | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No pom.xml found."
            exit 1
          fi

      - name: Build all Maven projects
        shell: bash
        run: |
          success=0
          failed=0

          while IFS= read -r pom; do
            project_dir="$(dirname "$pom")"

            echo ""
            echo "======================================"
            echo "BUILDING"
            echo "$project_dir"
            echo "======================================"

            if mvn -B -f "$pom" clean package -DskipTests; then

              echo "✅ BUILD SUCCESS"
              success=$((success + 1))

              find "$project_dir/target" \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                -exec cp {} build-output/ \;

            else

              echo "❌ BUILD FAILED"
              failed=$((failed + 1))

            fi

          done < <(find build-work -type f -name "pom.xml" | sort)

          echo ""
          echo "======================================"
          echo "BUILD SUMMARY"
          echo "======================================"
          echo "Successful: $success"
          echo "Failed:     $failed"
          echo "======================================"

          echo ""
          echo "Generated JAR files:"
          find build-output -type f -name "*.jar" -print

          if [ "$success" -eq 0 ]; then
            echo "No plugin was successfully built."
            exit 1
          fi

      - name: Upload all successful JARs
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Plugins
          path: build-output/*.jar
          if-no-files-found: error
