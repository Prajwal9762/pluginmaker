name: Build MineChatVote

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version"
        required: false
        default: "21"

      paper_version:
        description: "Paper API version (leave empty to use pom.xml)"
        required: false
        default: ""

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build MineChatVote
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. CHECKOUT
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # 2. FIND AND EXTRACT ZIP
      # =========================================
      - name: Extract MineChatVote ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for plugin ZIP..."
          echo "========================================"

          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::No plugin ZIP file found!"
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          rm -rf build
          mkdir -p build

          unzip -q -o "$ZIP" -d build

          echo ""
          echo "Extracted files:"
          find build -maxdepth 5 -type f | sort

      # =========================================
      # 3. FIND POM
      # =========================================
      - name: Locate Maven project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for pom.xml..."
          echo "========================================"

          POM="$(find build -type f -name pom.xml \
            -not -path '*/target/*' \
            | head -n 1)"

          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found inside extracted ZIP!"
            echo ""
            echo "Extracted files:"
            find build -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"

          echo "POM found:"
          echo "$POM"

          echo ""
          echo "Maven project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================
      # 4. SETUP JAVA
      # =========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}

      # =========================================
      # 5. JAVA INFO
      # =========================================
      - name: Show Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn -version

      # =========================================
      # 6. SHOW PROJECT
      # =========================================
      - name: Show project files
        shell: bash
        run: |
          echo "========================================"
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -not -path '*/target/*' \
            | sort

      # =========================================
      # 7. BUILD
      # =========================================
      - name: Build MineChatVote
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building MineChatVote"
          echo "========================================"

          if [ -n "${{ inputs.paper_version }}" ]; then

            echo "Using Paper version:"
            echo "${{ inputs.paper_version }}"

            mvn -B -ntp clean package \
              -DskipTests \
              -Dpaper.version="${{ inputs.paper_version }}"

          else

            echo "Using Paper version from pom.xml"

            mvn -B -ntp clean package \
              -DskipTests

          fi

      # =========================================
      # 8. FIND JAR
      # =========================================
      - name: Find built JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for built plugin JAR..."
          echo "========================================"

          find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

          JAR="$(find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "original-*.jar" \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "::error::No plugin JAR was created!"
            echo ""
            echo "Target directory:"
            find "$PROJECT_DIR/target" -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo ""
          echo "Built JAR:"
          echo "$JAR"

          rm -rf release
          mkdir -p release

          cp "$JAR" release/MineChatVote.jar

          echo ""
          echo "Final JAR:"
          ls -lh release/MineChatVote.jar

      # =========================================
      # 9. UPLOAD ARTIFACT
      # =========================================
      - name: Upload MineChatVote
        uses: actions/upload-artifact@v4
        with:
          name: MineChatVote
          path: release/MineChatVote.jar
          if-no-files-found: error
          retention-days: 30

      # =========================================
      # 10. GITHUB RELEASE
      # =========================================
      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MineChatVote v${{ github.run_number }}
          files: release/MineChatVote.jar
          generate_release_notes: true
