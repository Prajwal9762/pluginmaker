name: Build MineChatVote

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a GitHub Release with the built JAR"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build MineChatVote Plugin
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Repository contents"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

      # ============================================================
      # FIND PLUGIN ZIP
      # ============================================================
      - name: Find MineChatVote ZIP
        shell: bash
        run: |
          set -e

          ZIP_COUNT=$(find . -maxdepth 1 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::No plugin ZIP file found in repository root."
            echo "Expected something like:"
            echo "MineChatVote.zip"
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "::error::Multiple ZIP files found."
            find . -maxdepth 1 -type f -iname "*.zip"
            echo "This workflow expects one plugin ZIP."
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "PLUGIN_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # EXTRACT
      # ============================================================
      - name: Extract plugin
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "Extracting:"
          echo "$PLUGIN_ZIP"

          unzip -q -o "$PLUGIN_ZIP" -d build

          echo ""
          echo "Extracted files:"
          find build -maxdepth 6 -type f | sort

      # ============================================================
      # FIND POM
      # ============================================================
      - name: Find Maven project
        shell: bash
        run: |
          set -e

          mapfile -t POMS < <(
            find build \
              -type f \
              -name "pom.xml" \
              -not -path "*/target/*"
          )

          if [ "${#POMS[@]}" -eq 0 ]; then
            echo "::error::No pom.xml found inside the plugin ZIP."
            exit 1
          fi

          if [ "${#POMS[@]}" -gt 1 ]; then
            echo "::error::Multiple pom.xml files found."
            printf '%s\n' "${POMS[@]}"
            exit 1
          fi

          POM="${POMS[0]}"
          PROJECT_DIR="$(dirname "$POM")"

          echo "======================================"
          echo "Maven project"
          echo "======================================"
          echo "POM: $POM"
          echo "Project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # SETUP JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "${{ env.PROJECT_DIR }}/pom.xml"

      # ============================================================
      # CHECK JAVA + MAVEN
      # ============================================================
      - name: Check Java and Maven
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "Maven"
          echo "======================================"

          mvn -version

      # ============================================================
      # SHOW POM
      # ============================================================
      - name: Show POM
        shell: bash
        run: |
          echo "======================================"
          echo "pom.xml"
          echo "======================================"

          cat "$PROJECT_DIR/pom.xml"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build MineChatVote
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building MineChatVote"
          echo "======================================"

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -U \
            clean \
            package

      # ============================================================
      # FIND JAR
      # ============================================================
      - name: Find built JAR
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Build output"
          echo "======================================"

          find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

          mapfile -t JARS < <(
            find "$PROJECT_DIR/target" \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "original-*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar"
          )

          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "::error::No usable plugin JAR was produced."
            echo ""
            echo "Full target directory:"
            find "$PROJECT_DIR/target" -maxdepth 2 -type f -print
            exit 1
          fi

          echo ""
          echo "Selected JAR:"
          printf '%s\n' "${JARS[@]}"

          rm -rf release
          mkdir -p release

          # This plugin produces one JAR.
          cp "${JARS[0]}" "release/MineChatVote.jar"

          echo ""
          echo "Final JAR:"
          ls -lh release/MineChatVote.jar

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload MineChatVote JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineChatVote
          path: release/MineChatVote.jar
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "minechatvote-${{ github.run_number }}"
          name: "MineChatVote Build ${{ github.run_number }}"
          files: release/MineChatVote.jar
          generate_release_notes: true
