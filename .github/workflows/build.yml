name: Build MineChat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project (MineChat.zip in the repo root)
        run: |
          ZIP=""
          if [ -f ./MineChat.zip ]; then ZIP=./MineChat.zip; else ZIP=$(ls ./*.zip 2>/dev/null | head -n1 || true); fi
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir _src && unzip -q "$ZIP" -d _src
            SETTINGS=$(find _src -name settings.gradle.kts | head -n1)
          elif [ -f settings.gradle.kts ]; then
            SETTINGS=./settings.gradle.kts
          fi
          test -n "${SETTINGS:-}" || { echo "Project not found: upload MineChat.zip to the repo root"; exit 1; }
          echo "PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android platform and NDK (SDK is preinstalled on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust tests
        working-directory: ${{ env.PROJECT }}/rust
        run: cargo test --locked

      - name: Build Rust engine for Android
        working-directory: ${{ env.PROJECT }}/rust
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../app/src/main/jniLibs
          build --release --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp "${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk" MineChat-v1.3.0.apk

      - name: Upload APK as an Artifact (plain .apk, not zipped)
        uses: actions/upload-artifact@v7
        with:
          path: MineChat-v1.3.0.apk
          archive: false

      - name: Publish APK as a GitHub Release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build${{ github.run_number }}
          name: MineChat v1.3.0 (build ${{ github.run_number }})
          files: MineChat-v1.3.0.apk
