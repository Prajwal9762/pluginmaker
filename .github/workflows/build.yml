name: Build ChatCraft APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project (ChatCraft.zip in the repo root)
        run: |
          if ls ./*.zip >/dev/null 2>&1; then unzip -q -o "$(ls ./*.zip | head -n1)"; fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          test -n "$SETTINGS" || { echo "Project not found: upload ChatCraft.zip to the repo root"; exit 1; }
          echo "PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android platform and NDK (SDK is preinstalled on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust tests
        working-directory: ${{ env.PROJECT }}/rust
        run: cargo test --locked

      - name: Build Rust engine for Android
        working-directory: ${{ env.PROJECT }}/rust
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../app/src/main/jniLibs
          build --release --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp "${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk" ChatCraft.apk

      - name: Upload APK as an Artifact (plain .apk, not zipped)
        uses: actions/upload-artifact@v7
        with:
          path: ChatCraft.apk
          archive: false

      - name: Publish APK as a GitHub Release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ChatCraft APK #${{ github.run_number }}
          files: ChatCraft.apk
