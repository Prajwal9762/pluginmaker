name: Build MineChatVote

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version"
        required: false
        default: "21"

      paper_version:
        description: "Paper API version"
        required: false
        default: "1.21.1-R0.1-SNAPSHOT"

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build MineChatVote
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # JAVA
      # =========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java_version || '21' }}
          cache: maven

      # =========================================
      # CHECK PROJECT
      # =========================================
      - name: Find MineChatVote project
        shell: bash
        run: |
          set -e

          echo "Searching for pom.xml..."

          POM=$(find . -type f -name pom.xml \
            ! -path './.git/*' \
            | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found!"
            exit 1
          fi

          echo "Found:"
          echo "$POM"

          PROJECT_DIR=$(dirname "$POM")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================
      # SHOW PROJECT
      # =========================================
      - name: Show project files
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

      # =========================================
      # BUILD
      # =========================================
      - name: Build MineChatVote
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building MineChatVote"
          echo "========================================"

          mvn -B -ntp clean package \
            -DskipTests \
            -Dpaper.version="${{ github.event.inputs.paper_version || '1.21.1-R0.1-SNAPSHOT' }}"

      # =========================================
      # FIND JAR
      # =========================================
      - name: Find built JAR
        shell: bash
        run: |
          set -e

          echo "Searching for JAR..."

          find "$PROJECT_DIR/target" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -print

          JAR=$(find "$PROJECT_DIR/target" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was produced!"
            exit 1
          fi

          echo "Found JAR:"
          echo "$JAR"

          mkdir -p release

          cp "$JAR" release/MineChatVote.jar

          echo ""
          echo "Final plugin:"
          ls -lh release/MineChatVote.jar

      # =========================================
      # UPLOAD ARTIFACT
      # =========================================
      - name: Upload MineChatVote
        uses: actions/upload-artifact@v4
        with:
          name: MineChatVote
          path: release/MineChatVote.jar
          if-no-files-found: error
          retention-days: 30

      # =========================================
      # GITHUB RELEASE
      # =========================================
      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MineChatVote v${{ github.run_number }}
          files: release/MineChatVote.jar
          generate_release_notes: true
